<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Novel Story Prototype</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <div class="app">
    <div class="game-shell">
      <div class="game-viewport" id="gameViewport">
        <div class="game-stage" id="gameStage">

          <div class="bg-layer">
            <img id="bgImage" src="./assets/images/bg/placeholder.jpg" alt="background" />
            <div class="bg-vignette"></div>
            <div class="bg-bottom-shadow"></div>
          </div>

          <div class="char-layer" id="charLayer">
            <img id="char1" class="char hidden" alt="character 1" />
            <img id="char2" class="char hidden" alt="character 2" />
          </div>

          <div class="top-ui">
            <button class="icon-btn icon-left" id="locationBtn" aria-label="location">
              <img src="./assets/images/ui/location.png" alt="" />
            </button>

            <button class="menu-toggle icon-right" id="menuBtn" aria-label="menu">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>

          <div class="dialogue-area">
            <div class="name-row">
              <div class="speaker-ja" id="speakerJa"></div>
              <div class="speaker-en" id="speakerEn"></div>
            </div>

            <div class="dialogue-line-image">
              <img src="./assets/images/ui/line.png" alt="" />
            </div>

            <div class="text-row">
              <div class="dialogue-text" id="dialogueText"></div>
            </div>

            <button class="next-indicator hidden" id="nextBtn" aria-label="next">
              <img src="./assets/images/ui/tap-next.png" alt="" />
              <span>NEXT</span>
            </button>
          </div>

          <button class="tap-zone" id="tapZone" aria-label="tap to continue"></button>

          <div class="skip-banner hidden" id="skipBanner">SKIP ON</div>

          <div class="menu-panel hidden" id="menuPanel">
            <div class="menu-card">
              <button class="menu-close" id="menuClose" aria-label="close menu">×</button>
              <h2>MENU</h2>

              <label class="menu-item">
                <span>ストーリースキップ</span>
                <input type="checkbox" id="skipToggle" />
              </label>

              <label class="menu-item">
                <span>タイプ速度</span>
                <input type="range" id="speedRange" min="8" max="60" step="1" value="24" />
              </label>

              <button class="menu-btn" id="restartBtn">最初から読む</button>
            </div>
          </div>

          <div class="episode-end hidden" id="episodeEnd">
            <div class="episode-end-card">
              <p>この話はここまで。</p>
              <div class="episode-end-actions">
                <button id="readNextBtn">次のストーリーを読む</button>
                <button id="closeStoryBtn">読まない</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="orientation-overlay" id="orientationOverlay">
    横画面でご覧ください
  </div>

  <script src="./assets/js/app.js"></script>
</body>
</html>
