<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Novel Story Prototype</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <div class="app">
    <div class="game-shell">
      <div class="game-viewport" id="gameViewport">
        <div class="game-stage" id="stage">
          <div class="stage-gradient black" id="stageGradient"></div>

          <div class="bg-layer">
            <img id="bgA" class="bg active" src="./assets/images/bg/placeholder.jpg" alt="background A" />
            <img id="bgB" class="bg" src="" alt="background B" />
            <div class="bg-vignette"></div>
            <div class="bg-bottom-shadow"></div>
            <div class="flash-overlay" id="flashOverlay"></div>
            <div class="flash-frame" id="flashFrame"></div>
          </div>

          <div class="char-layer">
            <img id="char1" class="char hidden" alt="character 1" />
            <img id="char2" class="char hidden" alt="character 2" />
            <img id="char3" class="char hidden" alt="character 3" />
            <img id="char4" class="char hidden" alt="character 4" />
          </div>

          <div class="top-ui">
            <button class="icon-btn icon-left" type="button" aria-label="location">
              <img src="./assets/images/ui/location.png" alt="" />
            </button>

            <button
              class="menu-toggle icon-right"
              id="menuBtn"
              type="button"
              aria-label="menu"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>

            <div class="menu-panel hidden" id="menuPanel">
              <div class="menu-card">
                <h2>MENU</h2>
                <button class="menu-item-btn" id="backBtn" type="button">戻る</button>
                <button class="menu-item-btn" id="skipBtn" type="button">スキップ</button>
              </div>
            </div>
          </div>

          <div class="dialogue-area">
            <div class="name-row">
              <div class="speaker-ja" id="nameMain"></div>
              <div class="speaker-en" id="nameSub"></div>
            </div>

            <div class="dialogue-line-image">
              <img src="./assets/images/ui/line.png" alt="" />
            </div>

            <div class="text-row">
              <div class="dialogue-text" id="text"></div>
            </div>

            <div class="next-indicator" id="nextIndicator" aria-hidden="true">
              <img src="./assets/images/ui/tap-next.png" alt="" />
              <span>NEXT</span>
            </div>
          </div>

          <div id="endChoiceOverlay" class="end-choice-overlay hidden">
            <div class="end-choice-card">
              <p class="end-choice-title">この先をどうする？</p>
              <button id="continueBtn" type="button">続きを読む</button>
              <button id="finishBtn" type="button">終わりにする</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="orientation-overlay" id="orientationOverlay">
    横画面でご覧ください
  </div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
