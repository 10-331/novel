<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novel Story</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0e0f14;
      color: #fff;
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(217,255,63,.16), transparent 28%),
        linear-gradient(180deg, #17181e 0%, #090a0d 100%);
    }

    .top {
      width: min(960px, calc(100% - 32px));
      padding: 48px 28px;
      text-align: center;
    }

    .label {
      margin-bottom: 14px;
      font-size: 12px;
      letter-spacing: .24em;
      color: #d9ff3f;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 76px);
      letter-spacing: .08em;
      line-height: 1;
    }

    .lead {
      max-width: 620px;
      margin: 28px auto 40px;
      color: rgba(255,255,255,.72);
      line-height: 1.9;
      font-size: 15px;
    }

    .menu {
      display: grid;
      gap: 14px;
      width: min(420px, 100%);
      margin: 0 auto;
    }

    .menu a {
      display: block;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      color: #fff;
      text-decoration: none;
      letter-spacing: .12em;
      transition: .2s ease;
    }

    .menu a:hover {
      background: rgba(255,255,255,.1);
      transform: translateY(-2px);
    }

    .note {
      margin-top: 30px;
      color: rgba(255,255,255,.38);
      font-size: 12px;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main class="top">
    <div class="label">STORY PORTAL</div>
    <h1>Novel Story</h1>
    <p class="lead">
      ここはストーリー、イベント、キャラクター、世界設定へ進むための入口です。
      現在はノベルゲーム形式の本編を公開中です。
    </p>

    <nav class="menu">
      <a href="./story.html">MAIN STORY</a>
      <a href="./player.html?episode=ep01">最初から読む</a>
    </nav>

    <p class="note">Prototype / Chapter Unlock ADV</p>
  </main>
</body>
</html>
